                "@type": "Question",
                "name": "Receber esses leads é compatível com as regras da OAB?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Sim. A Chreos entrega inteligência derivada de registros e publicações públicas — uma intermediação transparente de informação, e não captação ativa e indiscriminada de clientela. A decisão de abordar (ou não) cada caso é sempre do advogado, que deve conduzir o contato de forma informativa e dentro do Provimento 205/2021 da OAB: sem promessa de resultado e sem oferta de honorários."
                }
              },
              {
                "@type": "Question",
                "name": "E a LGPD? É legal tratar esses dados?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Os dados têm origem em atos e publicações oficiais e públicas — diários de registro de imóveis e editais de leilão. O tratamento segue os princípios da LGPD (finalidade, minimização e transparência), apoiado, em regra, no legítimo interesse aplicável a dados de fontes públicas (art. 7º da Lei 13.709/2018). Ao receber um lead, o advogado passa a ser controlador independente para o uso que fizer da informação."
                }
              },
              {
                "@type": "Question",
                "name": "De onde vêm os dados?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Todas as informações vêm de fontes públicas oficiais — diários de registro de imóveis e editais de leilão publicados por cartórios de todo o Brasil. Nosso trabalho é monitorar, organizar e enriquecer registros que já são públicos por lei."
                }
              },
              {
                "@type": "Question",
                "name": "Os leads são exclusivos?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Sim — e isso é o padrão da Chreos. Cada lead é entregue a um único escritório: o mesmo contato nunca vai para um concorrente da sua região. Além de proteger o seu trabalho, a exclusividade é a forma mais alinhada às normas da OAB, que vedam oferecer o mesmo cliente a vários advogados."
                }
              },
              {
                "@type": "Question",
                "name": "Como funciona o pagamento?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Modelo pay-per-lead: você paga apenas pelos leads que recebe. O valor é definido de acordo com os filtros do seu perfil — não existe mensalidade nem taxa de adesão."
                }
              },
              {
                "@type": "Question",
                "name": "Quantos leads posso receber?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "O volume depende dos filtros configurados e da sua região — perfis mais amplos geram mais leads. Na demonstração mostramos exatamente quanto o seu perfil pode gerar."
                }
              },
              {
                "@type": "Question",
                "name": "Existe contrato de fidelidade?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Não. Você começa quando quiser, pausa quando quiser e ajusta seu perfil a qualquer momento."
                }

                "name": "Em quanto tempo começo a receber leads?",
                "acceptedAnswer": {
                  "@type": "Answer",
