# Redirect www → apex (SSL is terminated upstream)
server {
    listen 80;
    server_name www.chreos.com.br;
    return 301 https://chreos.com.br$request_uri;
}

server {
    listen 80 default_server;
    server_name chreos.com.br _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    # No-cache for entry points and SEO files
    location ~* ^/(index\.html|robots\.txt|sitemap\.xml)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Long cache for content-hashed assets
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
